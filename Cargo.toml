[package]
name = "spotirust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3"
log = "0.4"
base64 = "0.23.1"
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
librespot-core = "0.8"
librespot-oauth = "0.8"
librespot-protocol = "0.8"
protobuf = "3.7"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.8"
rgb = "0.8.53"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiny_http = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }
ttf-parser = "0.25.1"
ureq = { version = "2", features = ["json"] }
windows = { version = "0.61", features = ["Win32_Graphics_Imaging", "Win32_System_Com", "Win32_Foundation"] }
woff2-patched = "0.4.0"
zenavif = "0.1.6"
zenpixels = "0.2"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

# Keep target/ small: no debug info for dependencies, line tables only for our crate.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# Pixel loops (backdrop compositor) are unusably slow at opt-level 0.
[profile.dev.package.spotirust]
opt-level = 1

# Local GPUI copy: fixes colour emoji (COLR) rasterisation on Windows.
[patch.crates-io]
gpui = { path = "vendor/gpui" }
